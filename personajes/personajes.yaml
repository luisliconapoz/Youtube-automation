# ════════════════════════════════════════════════════════════════════
#  CATÁLOGO OFICIAL DE PERSONAJES — Pilo Studio
#  Fuente: proyectos/<marca>/guia/guia_oficial.jpg (guías oficiales)
#
#  REGLA UNIVERSAL: los 13 personajes usan la MISMA cara maestra
#  (pilo_studio/personajes/rig.py: CABEZA, OJO, PUPILA, CEJA, BOCA).
#  Solo cambian: color, ropa/accesorios, expresión y pose.
#  Blue es el único con mechón. Ningún accesorio entra en la zona facial
#  (ZONA_CARA): sin bigote, monóculo colgado del traje, gafas sobre la frente.
#  Todos parten de la misma expresión neutral; no hay expresiones propias.
# ════════════════════════════════════════════════════════════════════
personajes:
  # ---------------- FACT STICK ----------------
  blue:
    nombre: Blue
    marca: fact-stick
    color: "#00e5ff"
    accesorios: [mechon]
    pose: explicando
    rol: "Narrador principal: explica conceptos y guía la historia."
  green:
    nombre: Green
    marca: fact-stick
    color: "#3dff2e"
    accesorios: []
    pose: idea
    rol: "Inversiones y crecimiento; estrategias de largo plazo."
  pink:
    nombre: Pink
    marca: fact-stick
    color: "#ff2bd6"
    accesorios: [cabello_coleta]
    pose: preguntando
    rol: "Ejemplos cotidianos y nuevos ángulos."
  farmer:
    nombre: Farmer
    marca: fact-stick
    color: "#ffd400"
    accesorios: [sombrero_paja, overol, horquilla]
    pose: sosteniendo_izq
    rol: "Persona cotidiana: situaciones reales y preguntas comunes."
  rich:
    nombre: Rich
    marca: fact-stick
    color: "#ff2a2a"
    accesorios: [traje, chistera, monoculo]
    pose: brazos_cruzados
    rol: "Perspectiva de la élite rica; visión distinta y de largo plazo."

  # ---------------- MONEY LAB ----------------
  cyan:
    nombre: Cyan
    marca: money-lab
    color: "#00f0ff"
    accesorios: [casa_pecho]
    pose: explicando
    rol: "Narrador principal: amable, curioso, práctico."
  lime:
    nombre: Lime
    marca: money-lab
    color: "#b4ff1a"
    accesorios: [gorra, calculadora]
    pose: idea_sosteniendo
    rol: "Crédito, préstamos, deuda y seguros."
  brown:
    nombre: Brown
    marca: money-lab
    color: "#e08a3c"
    accesorios: [llave, casa_mano]
    pose: mostrando_ambas
    rol: "Agente inmobiliario: comprar, alquilar, hipotecas."
  gray:
    nombre: Gray
    marca: money-lab
    color: "#d2d2d2"
    accesorios: [camisa, cartel_casa]
    pose: mostrando_der
    rol: "Persona cotidiana que compra o alquila."

  # ---------------- WILD MONEY ----------------
  orange:
    nombre: Orange
    marca: wild-money
    color: "#ff8a00"
    accesorios: []
    pose: explicando
    rol: "Narrador principal: explica cómo funcionan las empresas."
  purple:
    nombre: Purple
    marca: wild-money
    color: "#d23cff"
    accesorios: [capa, traje, corona]
    pose: brazos_cruzados
    rol: "Multimillonario / CEO."
  white:
    nombre: White
    marca: wild-money
    color: "#f4f4ff"
    accesorios: [gafas, tableta]
    pose: senalando_tableta
    rol: "Analista: números, modelos de negocio y estrategia."
  teal:
    nombre: Teal
    marca: wild-money
    color: "#19e6d2"
    accesorios: [gorra, credencial]
    pose: rascandose
    rol: "Trabajador y consumidor; pregunta lo que preguntaría cualquiera."
