# ============================================================
#  PILO STUDIO — Configuración global
#  Cada proyecto puede sobrescribir cualquier clave en su propio
#  proyectos/<nombre>/proyecto.yaml
# ============================================================

idioma: es

# ---------- Fase 1: Dirección y guion ----------
guion:
  # Orden de proveedores. Se usa el primero que funcione.
  #  - manual:    usa proyectos/<x>/guion.yaml si existe (escrito a mano)
  #  - claude:    API de Anthropic (requiere el secreto ANTHROPIC_API_KEY)
  #  - plantilla: respaldo sin IA, cada párrafo de idea.md es una escena
  proveedores: [manual, claude, plantilla]
  claude:
    modelo: claude-opus-5-5
    esfuerzo: medium          # low | medium | high (más alto = más elaborado y más caro)

# ---------- Fase 2: Imágenes (lote) ----------
# Todas las imágenes del video (escenas + fondo de miniatura) entran en UNA cola.
# Cada proveedor en la nube lanza sus propios hilos y saca trabajos de esa cola en
# paralelo, respetando su ritmo máximo. Lo que falle se reintenta, pasa a otro
# proveedor y, en último caso, se resuelve con el respaldo local.
imagenes:
  #  - pollinations: Pollinations.ai (Flux). Sin clave: 1 hilo, ~1 imagen cada 16 s.
  #                  Con el secreto POLLINATIONS_API_KEY (gratis): varios hilos en paralelo.
  #  - huggingface:  Inference API gratuita de Hugging Face, requiere el secreto HF_TOKEN
  #  - referencias:  (respaldo local) usa las imágenes de referencia del usuario
  #  - placeholder:  (respaldo local) fondo con la paleta del proyecto, siempre funciona
  proveedores: [pollinations, huggingface, referencias, placeholder]
  repartir_entre_proveedores: true   # true = todos los proveedores en la nube trabajan a la vez
  pollinations:
    modelo: flux
    timeout: 120
    reintentos: 3                    # intentos por imagen antes de cederla a otro proveedor
    concurrencia: 4                  # hilos simultáneos (solo con clave)
    intervalo_con_clave: 1.0         # segundos mínimos entre peticiones con clave
    espera_anonimo: 16               # segundos entre peticiones sin clave
  huggingface:
    modelo: black-forest-labs/FLUX.1-schnell
    timeout: 120
    reintentos: 2
    concurrencia: 2
    intervalo: 1.0
  negativo: "texto, marca de agua, logo, deformado, borroso, baja calidad"

# ---------- Fase 3: Voz (edge-tts) ----------
audio:
  voz: es-MX-JorgeNeural      # `python -m pilo_studio voces --idioma es` para listar
  velocidad: "+0%"
  tono: "+0Hz"
  volumen: "+0%"
  concurrencia: 4             # escenas sintetizadas en paralelo
  reintentos: 3

# ---------- Fase 4: Ensamblaje y subtítulos ----------
video:
  fps: 30
  ken_burns: true             # zoom/paneo suave sobre cada imagen
  zoom_max: 1.12
  pausa_entre_escenas: 0.35   # segundos de respiro tras cada escena
  musica:
    archivo: null             # p.ej. assets/music/fondo.mp3 (música libre de derechos)
    volumen: 0.08
  subtitulos:
    activados: true
    fuente: Arial
    color: "&H00FFFFFF"       # formato ASS (AABBGGRR)
    color_borde: "&H00000000"

formatos:
  largo:
    ancho: 1920
    alto: 1080
    duracion_objetivo_min: 8   # 7–10 minutos
    palabras_por_subtitulo: 7
    tam_fuente: 54
    margen_v: 70
  short:
    ancho: 1080
    alto: 1920
    duracion_objetivo_min: 0.8 # ~50 s (< 60 s)
    palabras_por_subtitulo: 3
    tam_fuente: 96
    margen_v: 520

# ---------- Fase 5: Almacenamiento ----------
salida:
  # Copia local (relativa al repo). En Codespaces se descarga desde el explorador.
  # También se puede cambiar con la variable PILO_OUTPUT_DIR.
  carpeta: salida
  guardar_guion: true
  guardar_srt: true
  nube:
    activada: true
    # remoto:ruta de rclone. El remoto "onedrive" se crea con scripts/conectar_onedrive.sh
    # (cambia a "gdrive:..." o "dropbox:..." si prefieres otro servicio).
    destino: "onedrive:PiloStudio/Videos"
