      rol: "investments and growth; explains strategies and long-term thinking"
      personalidad: "smart, analytical, calm"
      colores: ["#00ff3c"]
      descripcion: "stick figure with a solid black round head, big white cartoon eyes and a glowing bright green neon outline body"
